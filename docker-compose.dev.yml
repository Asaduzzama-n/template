# Development Docker Compose - HOT RELOAD ENABLED
# Use: docker compose -f docker-compose.dev.yml up
#
# This mounts your source code and runs ts-node-dev for live changes.
# Any file changes will automatically restart the server.
# Access at: http://localhost:5000

services:
  app:
    image: node:22-alpine # Latest LTS Node.js
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=mongodb://mongodb:27017/template
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret}
      - JWT_EXPIRE_IN=1d
      - JWT_REFRESH_EXPIRE_IN=7d
      - LOG_LEVEL=debug
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Preserve node_modules from container (don't use host's)
      - /app/node_modules
    # Allow container to access host machine services (MongoDB, etc.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Update npm to latest, install deps, run dev server
    command: sh -c "npm install -g npm@latest && npm install && npm run dev"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongodb:
    image: mongo:latest
    command: [ "mongod", "--quiet" ]
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine # Latest stable Redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
  mongodb-data:
