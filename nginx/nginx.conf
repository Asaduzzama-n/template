# ===========================================
# Nginx Configuration for Express-Craft
# Production-Ready with Security Best Practices
# ===========================================

# Upstream configuration for load balancing
upstream app_servers {
    # Enable keepalive connections
    keepalive 32;
    
    # Backend servers
    server app:5000 weight=1 max_fails=3 fail_timeout=30s;
    
    # For multiple instances, add more servers:
    # server app_2:5000 weight=1;
    # server app_3:5000 weight=1;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ===========================================
# HTTP Server (Redirect to HTTPS)
# ===========================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===========================================
# HTTPS Server (Main Configuration)
# ===========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    
    # ===========================================
    # SSL/TLS Configuration
    # ===========================================
    
    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern TLS configuration (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ===========================================
    # Security Headers
    # ===========================================
    
    # Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
    
    # Permissions Policy
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # Hide nginx version
    server_tokens off;
    
    # ===========================================
    # Request Limits
    # ===========================================
    
    # Maximum request body size
    client_max_body_size 10M;
    
    # Connection limits
    limit_conn conn_limit 20;
    
    # Request timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    
    # ===========================================
    # Gzip Compression
    # ===========================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;
    
    # ===========================================
    # Locations
    # ===========================================
    
    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
    
    # Ready check endpoint (no rate limiting)
    location /ready {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
    
    # Auth endpoints with strict rate limiting
    location /api/v1/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://app_servers;
        include /etc/nginx/proxy_params.conf;
    }
    
    # API endpoints with rate limiting
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://app_servers;
        include /etc/nginx/proxy_params.conf;
    }
    
    # WebSocket endpoint for Socket.IO
    location /socket.io {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Static files (uploaded content)
    location /uploads {
        alias /var/www/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Prevent execution of uploaded files
        location ~* \.(php|jsp|cgi|pl|py)$ {
            deny all;
        }
    }
    
    # Root location
    location / {
        proxy_pass http://app_servers;
        include /etc/nginx/proxy_params.conf;
    }
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block common exploit paths
    location ~* (\.php|\.env|\.git|wp-admin|phpMyAdmin) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Custom error pages
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"success": false, "message": "Too many requests. Please slow down."}';
    }
    
    error_page 502 503 504 /5xx.json;
    location = /5xx.json {
        internal;
        default_type application/json;
        return 503 '{"success": false, "message": "Service temporarily unavailable. Please try again later."}';
    }
}
