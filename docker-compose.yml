services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_app
    ports:
      - "${PORT:-5000}:5000"
    env_file: .env
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/express_craft_db
      - REDIS_HOST=redis
      - RUSTFS_ENDPOINT=http://rustfs:9000
    depends_on:
      - mongodb
      - redis
      - rustfs
    networks:
      - app-network

  # MongoDB with Persistence
  mongodb:
    image: mongo:latest
    container_name: mongodb_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: always

  # Redis
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: always

  # RustFS (S3-compatible)
  rustfs:
    image: rustfs/rustfs:latest # Ensure this is the correct image for your RustFS
    container_name: rustfs_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    command: /data
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  rustfs_data:
    driver: local
