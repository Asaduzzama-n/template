services:
  # MongoDB Service (Local with persistence)
  mongodb:
    image: mongo:latest
    container_name: hola-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: hola-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # Backend App Service
  backend:
    build: .
    container_name: hola-backend
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongodb:27017/techzu_db}
      - REDIS_URL=redis
      - REDIS_PORT=6379
      - PORT=5000
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hola-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
  redis_data:
